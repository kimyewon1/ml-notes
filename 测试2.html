<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企鹅骑三轮车</title>
<style>
  html,body{margin:0;height:100%;background:#cfefff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;}
  h1{margin:16px 0 8px;color:#1f4e79;font-size:26px;letter-spacing:4px;}
  svg{width:min(96vw,1000px);height:auto;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#87d3ff;}
  .tip{color:#3a6a90;font-size:13px;margin:8px 0 16px;}
</style>
</head>
<body>
<div class="wrap">
<h1>🐧 企鹅骑三轮车</h1>
<svg id="scene" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec4ff"/>
      <stop offset="1" stop-color="#d9f3ff"/>
    </linearGradient>
    <radialGradient id="bodyG" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#0f141c"/>
    </radialGradient>
    <radialGradient id="bellyG" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e8ef"/>
    </radialGradient>
    <g id="tree">
      <rect x="-6" y="-10" width="12" height="40" fill="#7a4f2a"/>
      <circle cx="0" cy="-30" r="28" fill="#3fa34d"/>
      <circle cx="-16" cy="-14" r="18" fill="#37923f"/>
      <circle cx="16" cy="-16" r="18" fill="#4bb85a"/>
    </g>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="40" ry="18" fill="#fff"/>
      <ellipse cx="-25" cy="5" rx="25" ry="14" fill="#fff"/>
      <ellipse cx="25" cy="6" rx="28" ry="13" fill="#fff"/>
      <ellipse cx="5" cy="-12" rx="22" ry="16" fill="#fff"/>
    </g>
  </defs>

  <!-- 天空 -->
  <rect width="800" height="500" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="42" fill="#ffe066"/>
  <circle cx="680" cy="80" r="56" fill="#ffe066" opacity=".25">
    <animate attributeName="r" values="52;62;52" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 云 -->
  <g id="clouds" opacity=".95"></g>

  <!-- 远山 -->
  <g id="hills"></g>

  <!-- 树 -->
  <g id="trees"></g>

  <!-- 地面 -->
  <rect x="0" y="400" width="800" height="100" fill="#6b6f78"/>
  <rect x="0" y="396" width="800" height="8" fill="#9ccc65"/>
  <g id="dashes"></g>
  <rect x="0" y="470" width="800" height="30" fill="#8bc34a"/>

  <!-- 影子 -->
  <ellipse cx="420" cy="403" rx="170" ry="9" fill="rgba(0,0,0,.25)"/>

  <!-- 三轮车 + 企鹅 -->
  <g id="rider">
    <!-- 后方远侧后轮 -->
    <g id="rearWheelFar" opacity=".65">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#222" stroke-width="6"/>
      <g class="spokes" stroke="#888" stroke-width="2"></g>
      <circle r="4" fill="#666"/>
    </g>

    <!-- 远侧腿 -->
    <path id="legFar" fill="none" stroke="#d9822b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footFar" fill="#d9822b"/>

    <!-- 车架 -->
    <g stroke="#e53935" stroke-width="8" stroke-linecap="round" fill="none">
      <path d="M300 375 L400 340 L505 270"/>
      <path d="M400 340 L410 302"/>
      <path d="M300 375 L410 302"/>
      <path d="M505 270 L520 350" stroke="#c62828"/>
      <path d="M505 270 L500 246" stroke="#c62828"/>
    </g>
    <!-- 后轴 -->
    <line x1="285" y1="370" x2="300" y2="375" stroke="#555" stroke-width="5"/>
    <!-- 车筐 -->
    <path d="M270 330 L330 330 L322 352 L278 352 Z" fill="#ffb74d" stroke="#a86b1e" stroke-width="2"/>
    <path d="M280 330 L284 352 M295 330 L296 352 M310 330 L308 352" stroke="#a86b1e" stroke-width="1.5"/>
    <circle cx="290" cy="322" r="9" fill="#ff5252"/>
    <path d="M290 313 q3 -6 7 -4" stroke="#4caf50" stroke-width="2" fill="none"/>
    <circle cx="308" cy="324" r="8" fill="#ffd54f"/>

    <!-- 车座 -->
    <path d="M388 298 Q410 288 432 296 Q430 306 410 306 Q392 306 388 298 Z" fill="#333"/>

    <!-- 车把 -->
    <path d="M500 246 Q492 236 474 240" stroke="#444" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="462" y="234" width="16" height="10" rx="4" fill="#111"/>
    <!-- 车铃 -->
    <g id="bell">
      <circle cx="504" cy="240" r="6" fill="#ffd700" stroke="#b8860b" stroke-width="1.5"/>
    </g>

    <!-- 企鹅 -->
    <g id="penguin">
      <!-- 远侧翅膀 -->
      <path d="M395 185 Q440 200 468 236" stroke="#0f141c" stroke-width="16" fill="none" stroke-linecap="round" opacity=".85"/>
      <!-- 身体 -->
      <ellipse cx="400" cy="220" rx="52" ry="78" fill="url(#bodyG)"/>
      <ellipse cx="412" cy="232" rx="34" ry="60" fill="url(#bellyG)"/>
      <!-- 头 -->
      <g id="head">
        <circle cx="410" cy="132" r="40" fill="url(#bodyG)"/>
        <path d="M398 130 Q412 104 436 124 Q446 146 428 158 Q404 160 398 130 Z" fill="#fff"/>
        <!-- 眼睛 -->
        <g id="eye">
          <ellipse cx="425" cy="130" rx="6" ry="7" fill="#111"/>
          <circle cx="427" cy="127" r="2" fill="#fff"/>
        </g>
        <!-- 腮红 -->
        <ellipse cx="420" cy="148" rx="7" ry="4" fill="#ff8a80" opacity=".7"/>
        <!-- 嘴 -->
        <path d="M440 136 L466 142 L440 150 Z" fill="#ffa726"/>
        <path d="M440 143 L462 142" stroke="#e65100" stroke-width="1.5"/>
        <!-- 帽子 -->
        <path d="M376 118 Q384 84 414 88 Q444 92 446 116 Q412 104 376 118 Z" fill="#1e88e5"/>
        <rect x="372" y="112" width="78" height="10" rx="5" fill="#fff" transform="rotate(-4 410 117)"/>
        <circle id="pompom" cx="410" cy="84" r="9" fill="#fff"/>
      </g>
      <!-- 围巾 -->
      <path d="M370 168 Q410 182 446 166 L448 178 Q410 196 370 180 Z" fill="#e53935"/>
      <path id="scarfTail" d="M376 172 Q350 178 326 172 L326 186 Q350 192 378 184 Z" fill="#e53935"/>
      <!-- 近侧翅膀 -->
      <path id="wingNear" d="M405 190 Q448 205 470 240" stroke="#1b222c" stroke-width="18" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 前轮 -->
    <g id="frontWheel">
      <circle cx="0" cy="0" r="50" fill="none" stroke="#222" stroke-width="9"/>
      <circle cx="0" cy="0" r="44" fill="none" stroke="#bbb" stroke-width="2"/>
      <g class="spokes" stroke="#9e9e9e" stroke-width="2"></g>
      <circle r="6" fill="#555"/>
    </g>

    <!-- 近侧后轮 -->
    <g id="rearWheelNear">
      <circle cx="0" cy="0" r="25" fill="none" stroke="#222" stroke-width="7"/>
      <g class="spokes" stroke="#9e9e9e" stroke-width="2"></g>
      <circle r="4" fill="#555"/>
    </g>

    <!-- 曲柄 -->
    <line id="crank" stroke="#444" stroke-width="5" stroke-linecap="round"/>

    <!-- 近侧腿 -->
    <path id="legNear" fill="none" stroke="#ff9f43" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="footNear" fill="#ff9f43"/>
  </g>

  <!-- 音符/气泡 -->
  <g id="notes" font-size="22" fill="#1f4e79"></g>
</svg>
<div class="tip">点击画面可以按响车铃 🔔</div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const mk = (tag, attrs, parent) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  };

  // 辐条
  document.querySelectorAll(".spokes").forEach(g => {
    const r = g.parentNode.querySelector("circle").getAttribute("r") - 4;
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      mk("line", {x1:0, y1:0, x2:(r*Math.cos(a)).toFixed(1), y2:(r*Math.sin(a)).toFixed(1)}, g);
    }
  });

  // 背景元素
  const clouds = [], trees = [], hills = [], dashes = [];
  for (let i = 0; i < 4; i++) {
    const u = mk("use", {href:"#cloud"}, $("clouds"));
    clouds.push({el:u, x:i*230+40, y:60+((i*37)%70), s:0.7+(i%3)*0.25});
  }
  for (let i = 0; i < 3; i++) {
    const h = mk("ellipse", {rx:220, ry:90, fill: i%2 ? "#a5d6a7" : "#81c784"}, $("hills"));
    hills.push({el:h, x:i*360, y:400});
  }
  for (let i = 0; i < 5; i++) {
    const t = mk("use", {href:"#tree"}, $("trees"));
    trees.push({el:t, x:i*190+60, y:372, s:0.8+(i%2)*0.3});
  }
  for (let i = 0; i < 10; i++) {
    const d = mk("rect", {y:432, width:44, height:6, rx:3, fill:"#f5f5f5"}, $("dashes"));
    dashes.push({el:d, x:i*90});
  }

  // 几何参数
  const FRONT = {x:520, y:350, r:50};
  const REAR = {x:300, y:375, r:25};
  const REAR_FAR = {x:285, y:370};
  const HIP_NEAR = {x:418, y:286}, HIP_FAR = {x:408, y:282};
  const CRANK = 22, THIGH = 74, SHIN = 72;

  function knee(h, f, a, b) {
    const dx = f.x - h.x, dy = f.y - h.y;
    let d = Math.hypot(dx, dy);
    d = Math.min(d, a + b - 0.5);
    const ux = dx / d, uy = dy / d;
    const along = (a*a - b*b + d*d) / (2*d);
    const h2 = Math.sqrt(Math.max(0, a*a - along*along));
    return {x: h.x + ux*along + uy*h2, y: h.y + uy*along - ux*h2};
  }
  function footPath(p, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    const pts = [[-6,-4],[18,-6],[24,0],[18,4],[22,8],[-6,6]];
    return "M" + pts.map(([x,y]) => (p.x + x*c - y*s).toFixed(1)+" "+(p.y + x*s + y*c).toFixed(1)).join(" L") + " Z";
  }
  function setLeg(legEl, footEl, hip, pedal) {
    const k = knee(hip, pedal, THIGH, SHIN);
    legEl.setAttribute("d", `M${hip.x} ${hip.y} L${k.x.toFixed(1)} ${k.y.toFixed(1)} L${pedal.x.toFixed(1)} ${pedal.y.toFixed(1)}`);
    footEl.setAttribute("d", footPath(pedal, 0.15));
  }

  let theta = 0, last = null, blinkT = 0, bellT = -10;
  const OMEGA = 3.2; // rad/s
  const speed = OMEGA * FRONT.r;

  function wrap(v, w) { return ((v % w) + w) % w; }

  function frame(t) {
    if (last === null) last = t;
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    const time = t / 1000;
    theta += OMEGA * dt;

    // 车轮
    const fdeg = theta * 180 / Math.PI;
    const rdeg = fdeg * FRONT.r / REAR.r;
    const bump = Math.sin(theta * 2) * 1.2;
    $("frontWheel").setAttribute("transform", `translate(${FRONT.x} ${FRONT.y}) rotate(${fdeg})`);
    $("rearWheelNear").setAttribute("transform", `translate(${REAR.x} ${REAR.y}) rotate(${rdeg})`);
    $("rearWheelFar").setAttribute("transform", `translate(${REAR_FAR.x} ${REAR_FAR.y}) rotate(${rdeg})`);

    // 脚踏
    const pN = {x: FRONT.x + CRANK*Math.cos(theta), y: FRONT.y + CRANK*Math.sin(theta)};
    const pF = {x: FRONT.x + CRANK*Math.cos(theta+Math.PI), y: FRONT.y + CRANK*Math.sin(theta+Math.PI)};
    const crank = $("crank");
    crank.setAttribute("x1", pF.x); crank.setAttribute("y1", pF.y);
    crank.setAttribute("x2", pN.x); crank.setAttribute("y2", pN.y);
    setLeg($("legNear"), $("footNear"), HIP_NEAR, pN);
    setLeg($("legFar"), $("footFar"), HIP_FAR, pF);

    // 企鹅身体摇摆
    const bob = Math.sin(theta * 2) * 2.5;
    const sway = Math.sin(theta) * 2;
    $("penguin").setAttribute("transform", `translate(0 ${bob}) rotate(${sway} 400 290)`);
    $("head").setAttribute("transform", `rotate(${Math.sin(time*2.1)*5} 410 160)`);
    $("pompom").setAttribute("cy", 84 + Math.sin(time*6)*2);
    $("rider").setAttribute("transform", `translate(0 ${bump})`);

    // 围巾飘动
    const w1 = Math.sin(time*8)*7, w2 = Math.sin(time*8+1.5)*9;
    $("scarfTail").setAttribute("d",
      `M376 172 Q350 ${178+w1} 322 ${170+w2} L320 ${186+w2} Q350 ${194+w1} 378 184 Z`);

    // 眨眼
    blinkT += dt;
    const eye = $("eye");
    if (blinkT > 3.2) { eye.setAttribute("transform", "translate(0 130) scale(1 0.1) translate(0 -130)"); }
    if (blinkT > 3.35) { eye.removeAttribute("transform"); blinkT = 0; }

    // 车铃
    const since = time - bellT;
    const shake = since < 0.6 ? Math.sin(since*60)*12*(1-since/0.6) : 0;
    $("bell").setAttribute("transform", `rotate(${shake} 504 246)`);

    // 背景滚动 (视差)
    const dist = theta * FRONT.r;
    clouds.forEach(c => {
      const x = wrap(c.x - dist*0.08 - time*8, 920) - 60;
      c.el.setAttribute("transform", `translate(${x} ${c.y}) scale(${c.s})`);
    });
    hills.forEach(h => {
      const x = wrap(h.x - dist*0.2, 1080) - 140;
      h.el.setAttribute("cx", x); h.el.setAttribute("cy", h.y);
    });
    trees.forEach(tr => {
      const x = wrap(tr.x - dist*0.55, 950) - 60;
      tr.el.setAttribute("transform", `translate(${x} ${tr.y}) scale(${tr.s})`);
    });
    dashes.forEach(d => {
      d.el.setAttribute("x", wrap(d.x - dist, 900) - 50);
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 点击按铃
  $("scene").addEventListener("click", () => {
    bellT = performance.now() / 1000;
    const n = mk("text", {x:510, y:225}, $("notes"));
    n.textContent = ["♪","♫","叮铃~"][Math.floor(Math.random()*3)];
    n.animate([
      {transform:"translate(0,0)", opacity:1},
      {transform:"translate(30px,-70px)", opacity:0}
    ], {duration:1200, easing:"ease-out"}).onfinish = () => n.remove();
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18].forEach(off => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = 1800;
        g.gain.setValueAtTime(0.25, ac.currentTime + off);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + off + 0.5);
        o.connect(g); g.connect(ac.destination);
        o.start(ac.currentTime + off); o.stop(ac.currentTime + off + 0.5);
      });
    } catch(e) {}
  });
})();
</script>
</body>
</html>
